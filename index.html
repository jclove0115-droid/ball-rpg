오</button><button class="class" data-j="martial"><strong>🥋 무술가</strong>연타 · 패리 · 돌진 · 4초 보호막</button><button class="class" data-j="necro"><strong>☠️ 네크로맨서</strong>해골지팡이 · 독 · 구속 · 보호막 · 좀비 어그로</button></div></div></div><div class="level" id="level"><div class="lvbox"><div style="font-size:22px;font-weight:1000;color:#ffe36d">⬆ LEVEL UP!</div><div style="font-size:9px">하나를 골라! 이번 게임 동안 영구 적용.</div><div class="choices" id="choices"></div><div id="perm" style="font-size:7px;opacity:.8;margin-top:8px"></div></div></div></div><div class="info">모바일: 왼쪽 조이스틱 이동 · 오른쪽 공격/스킬 · BGM 버튼을 눌러 음악 ON</div></div></div><script>
(()=>{const G=document.getElementById('game'),q=s=>G.querySelector(s),c=q('#c'),x=c.getContext('2d'),start=q('#start'),levelUI=q('#level'),choices=q('#choices'),joy=q('#joy'),stick=q('#stick'),atk=q('#atk'),sbs=[...G.querySelectorAll('.sk')],shop=q('#shop'),ann=q('#ann'),follow=q('#follow');const J={swordsman:{n:'검사',col:'#d65b5b',hp:125,r:.2,d:18,s:['버프','돌진참격','검기','회전베기','보호막']},archer:{n:'궁수',col:'#59ad68',hp:100,r:1,d:12,s:['파워샷','더블샷','구르기','연사10','보호막']},mage:{n:'마법사',col:'#6c78db',hp:110,r:2,d:20,s:['파이어볼','연쇄번개','물보호막','메테오']},martial:{n:'무술가',col:'#d29a43',hp:130,r:.1,d:15,s:['연타','패리','돌진','보호막']},necro:{n:'네크로맨서',col:'#76558f',hp:105,r:1.5,d:14,s:['독','구속','보호막']}};let job=null,p=null,en=[],bul=[],ebul=[],fx=[],drops=[],zs=[],wave=0,gold=0,pots=0,armor=false,boost=0,kills=0,atkCd=0,cd=[0,0,0,0,0],jv={x:0,y:0},run=false,resting=false,rest=0,last=performance.now(),annT=0,lv=1,xp=0,need=5,pending=0,choosing=false,perm={atk:0,hp:0,as:0,ms:0};
const say=(t,d=.7)=>{ann.textContent=t;ann.style.opacity=1;annT=d};const maxHP=()=>J[job].hp*(1+perm.hp/100);const mkP=()=>({x:320,y:180,r:17,hp:maxHP(),max:maxHP(),face:0,inv:0,shield:0,parry:0,counter:false,self:0});const mkZ=(a,b)=>({x:a,y:b,r:12,hp:60,max:60,sp:58,atk:.2,d:8});function spawn(){let s=Math.floor(Math.random()*4);return s===0?{x:12,y:40+Math.random()*280}:s===1?{x:628,y:40+Math.random()*280}:s===2?{x:50+Math.random()*540,y:25}:{x:50+Math.random()*540,y:335}}function mkE(t,n){let a=spawn(),b={x:a.x,y:a.y,bind:0,poison:0,pt:0};if(t==='final')return{...b,r:40,hp:7000,max:7000,sp:78,d:50,type:t,atk:2,range:65,col:'#2d183f',dash:5,shock:7};if(t==='boss'){let h=520+n*30;return{...b,r:29,hp:h,max:h,sp:66,d:30,type:t,atk:2,range:52,col:'#7d409b'}}if(t==='archer'){let h=45+n*5;return{...b,r:14,hp:h,max:h,sp:76,d:16,type:t,atk:1,range:105,col:'#416f48'}}if(t==='mage'){let h=55+n*6;return{...b,r:15,hp:h,max:h,sp:72,d:20,type:t,atk:1,range:100,col:'#594c9c'}}if(t==='healer'){let h=60+n*5;return{...b,r:15,hp:h,max:h,sp:70,d:0,type:t,atk:99,range:35,heal:2,col:'#d55c88'}}let h=50+n*7;return{...b,r:13,hp:h,max:h,sp:88,d:18,type:'normal',atk:1,range:28,col:'#8b503f'}}function pick(n,i){if(n>50&&i%6===5)return'mage';if(n>30&&i%5===4)return'healer';if(n>10&&i%4===3)return'archer';return'normal'}const count=n=>5+Math.floor((n-1)/2);const bossWave=()=>wave===100||wave%10===0;
function ui(){q('#wave').textContent=wave;q('#left').textContent=en.length;q('#lv').textContent=lv;q('#xp').textContent=xp;q('#need').textContent=need;q('#zc').textContent=zs.length;q('#prep').textContent=resting?Math.ceil(rest):'-';q('#job').textContent=job?J[job].n:'-';q('#gold').textContent=gold;q('#pots').textContent=pots;q('#boost').textContent=boost>0?Math.ceil(boost)+'s':'-';q('#hp').style.width=p?Math.max(0,p.hp/p.max*100)+'%':'0%';atk.textContent=atkCd>0?atkCd.toFixed(1)+'s':'공격';if(job)sbs.forEach((b,i)=>{let s=J[job].s[i];b.textContent=!s?'-':cd[i]>0?cd[i].toFixed(1):s;b.disabled=!s});if(p){let r=c.getBoundingClientRect();follow.style.left=p.x*r.width/640+'px';follow.style.top=p.y*r.height/360-17+'px'}}
function gain(v){xp+=v;while(xp>=need){xp-=need;lv++;pending++;need=5+(lv-1)*2}if(pending&&!choosing)openChoice()}function randChoice(){let v=1+Math.floor(Math.random()*25);if(Math.random()<.22)return{t:'gold',v,ic:'🪙',n:'골드 획득',d:`골드 ${v}개`};let a=['atk','hp','as','ms'],t=a[Math.floor(Math.random()*4)],m={atk:['⚔️','공격력'],hp:['❤️','최대체력'],as:['⚡','공격속도'],ms:['💨','이동속도']};return{t,v,ic:m[t][0],n:m[t][1],d:`+${v}%`}}function openChoice(){choosing=true;levelUI.style.display='flex';choices.innerHTML='';[randChoice(),randChoice(),randChoice()].forEach(o=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<strong>${o.ic} ${o.n}</strong>${o.d}`;b.onclick=()=>choose(o);choices.appendChild(b)});q('#perm').textContent=`공격 +${perm.atk}% / 체력 +${perm.hp}% / 공속 +${perm.as}% / 이속 +${perm.ms}%`}function choose(o){if(o.t==='gold')gold+=o.v;else if(o.t==='hp'){let old=p.max;perm.hp+=o.v;p.max=maxHP();p.hp=Math.min(p.max,p.hp+p.max-old)}else perm[o.t]+=o.v;pending--;if(pending)openChoice();else{choosing=false;levelUI.style.display='none'}ui()}
function startWave(n){wave=n;en=[];bul=[];ebul=[];drops=[];resting=false;shop.style.display='none';p.max=maxHP();p.hp=p.max;p.inv=1;let ct=count(n);if(n===100){en.push(mkE('final',n));for(let i=0;i<ct;i++)en.push(mkE(pick(n,i),n));say('☠ FINAL BOSS ☠',2)}else if(n%10===0){en.push(mkE('boss',n));for(let i=0;i<ct;i++)en.push(mkE(pick(n,i),n));say('⚠ BOSS '+n,1.5)}else{for(let i=0;i<ct;i++)en.push(mkE(pick(n,i),n));say(`WAVE ${n} · ${ct}마리`,1)}run=true;ui()}function doRest(){run=false;resting=true;rest=wave%10===0?30:15;p.hp=p.max;bul=[];ebul=[];drops=[];if(wave%10===0)shop.style.display='block'}
function reset(){job=null;p=null;en=[];bul=[];ebul=[];fx=[];drops=[];zs=[];wave=0;gold=0;pots=0;armor=false;boost=0;kills=0;atkCd=0;cd=[0,0,0,0,0];lv=1;xp=0;need=5;pending=0;choosing=false;perm={atk:0,hp:0,as:0,ms:0};run=false;resting=false;start.style.display='flex';levelUI.style.display='none';follow.style.display='none';shop.style.display='none';ui()}q('#reset').onclick=reset;G.querySelectorAll('.class').forEach(b=>b.onclick=()=>{job=b.dataset.j;p=mkP();start.style.display='none';follow.style.display='block';startWave(1)});
function near(x0=p.x,y0=p.y){let b=null,d=1e9;for(const e of en){let z=Math.hypot(e.x-x0,e.y-y0);if(z<d){d=z;b=e}}return b}function target(e){let best={k:'p',o:p,d:Math.hypot(p.x-e.x,p.y-e.y)};for(const z of zs){let d=Math.hypot(z.x-e.x,z.y-e.y);if(z.hp>0&&d<best.d)best={k:'z',o:z,d}}return best}const dmgMul=()=>(1+perm.atk/100)*(boost>0?1.1:1)*(p.self>0?1.5:1);const rate=()=>J[job].r/(1+perm.as/100);function shoot(d,sp,t='orb',r=5){let e=near();if(!e)return;let a=Math.atan2(e.y-p.y,e.x-p.x);p.face=a;bul.push({x:p.x+Math.cos(a)*22,y:p.y+Math.sin(a)*22,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,d:d*dmgMul(),life:2,t})}function slash(rad,d,col='#ff744f'){let e=near(),a=e?Math.atan2(e.y-p.y,e.x-p.x):p.face;p.face=a;fx.push({t:'slash',x:p.x,y:p.y,r:rad,a,col,life:.2,max:.2});for(const o of en)if(Math.hypot(o.x-p.x,o.y-p.y)<rad+o.r)o.hp-=d*dmgMul()}function aoe(rad,d,col='#efb34d'){fx.push({t:'ring',x:p.x,y:p.y,r:rad,col,life:.3,max:.3});for(const o of en)if(Math.hypot(o.x-p.x,o.y-p.y)<rad+o.r)o.hp-=d*dmgMul()}
function basic(){if(!run||choosing||atkCd>0)return;if(job==='swordsman')slash(52,18);else if(job==='martial'){if(p.counter){p.counter=false;aoe(230,70,'#ffe35c');say('💥 패리 카운터!')}else slash(44,15,'#ffc85f')}else if(job==='archer')shoot(12,410,'arrow',4);else if(job==='mage')shoot(20,300,'magic',7);else shoot(14,290,'dark',7);atkCd=rate()}atk.onpointerdown=e=>{e.preventDefault();basic()};
function use(i){if(!run||choosing||cd[i]>0)return;if(job==='swordsman'){if(i===0){p.self=7;cd[i]=9}else if(i===1){let e=near(),a=e?Math.atan2(e.y-p.y,e.x-p.x):p.face;for(let k=1;k<8;k++)fx.push({t:'after',x:p.x+Math.cos(a)*12*k,y:p.y+Math.sin(a)*12*k,col:'#d65b5b',life:.3,max:.3});p.x+=Math.cos(a)*90;p.y+=Math.sin(a)*90;p.inv=.35;slash(68,42);cd[i]=3.4}else if(i===2){shoot(56,350,'wave',11);cd[i]=4.4}else if(i===3){aoe(84,55);cd[i]=6}else if(i===4){p.shield=4;cd[i]=10}}else if(job==='archer'){if(i===0){shoot(50,455,'arrow',6);cd[i]=2.5}else if(i===1){shoot(28,420,'arrow',4);setTimeout(()=>run&&!choosing&&shoot(28,420,'arrow',4),100);cd[i]=3.8}else if(i===2){p.x-=Math.cos(p.face)*80;p.y-=Math.sin(p.face)*80;p.inv=.4;cd[i]=4}else if(i===3){for(let k=0;k<10;k++)setTimeout(()=>run&&!choosing&&shoot(14,440,'arrow',4),k*80);cd[i]=8}else if(i===4){p.shield=4;cd[i]=10}}else if(job==='mage'){if(i===0){shoot(53,300,'fire',9);cd[i]=2.7}else if(i===1){let cur=near(),used=new Set(),sx=p.x,sy=p.y;for(let n=0;n<6&&cur;n++){used.add(cur);cur.hp-=(44-n*4)*dmgMul();fx.push({t:'lightning',x:sx,y:sy,x2:cur.x,y2:cur.y,life:.25,max:.25});sx=cur.x;sy=cur.y;let nx=null,bd=150;for(const e of en){let d=Math.hypot(e.x-sx,e.y-sy);if(!used.has(e)&&d<bd){bd=d;nx=e}}cur=nx}cd[i]=5}else if(i===2){p.shield=12;cd[i]=14}else if(i===3){let e=near();if(e){let tx=e.x,ty=e.y;fx.push({t:'meteor',x:tx,y:ty,fromY:-60,life:.65,max:.65});setTimeout(()=>{if(!run)return;for(const o of en)if(Math.hypot(o.x-tx,o.y-ty)<82)o.hp-=85*dmgMul();fx.push({t:'blast',x:tx,y:ty,r:82,life:.4,max:.4})},420)}cd[i]=11}}else if(job==='martial'){if(i===0){for(let k=0;k<10;k++)setTimeout(()=>run&&!choosing&&slash(42,7,'#ffc85f'),k*55);cd[i]=4}else if(i===1){p.parry=1;cd[i]=4;fx.push({t:'parry',x:p.x,y:p.y,r:34,life:1,max:1})}else if(i===2){let e=near(),a=e?Math.atan2(e.y-p.y,e.x-p.x):p.face;for(let k=1;k<8;k++)fx.push({t:'after',x:p.x+Math.cos(a)*14*k,y:p.y+Math.sin(a)*14*k,col:'#d29a43',life:.3,max:.3});p.x+=Math.cos(a)*100;p.y+=Math.sin(a)*100;p.inv=.3;aoe(48,30);cd[i]=3}else if(i===3){p.shield=4;cd[i]=10;say('🛡 4초 보호막!')}}else if(job==='necro'){if(i===0){let e=near();if(e){e.poison=6;e.pd=5;e.pt=0;fx.push({t:'poisonBurst',x:e.x,y:e.y,r:30,life:.5,max:.5})}cd[i]=5}else if(i===1){for(const e of en)if(Math.hypot(e.x-p.x,e.y-p.y)<145){e.bind=3;fx.push({t:'bindBurst',x:e.x,y:e.y,r:28,life:.55,max:.55})}cd[i]=7}else if(i===2){p.shield=4;cd[i]=10}}}sbs.forEach((b,i)=>b.onpointerdown=e=>{e.preventDefault();use(i)});

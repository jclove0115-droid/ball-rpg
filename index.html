const launcher=document.getElementById('launcher'),frame=document.getElementById('frame'),back=document.getElementById('back'),error=document.getElementById('error');
function decodeUtf8(b64){const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(bytes)}
function launch(b64){try{frame.srcdoc=decodeUtf8(b64);launcher.style.display='none';frame.style.display='block';back.style.display='block'}catch(e){error.style.display='block';error.textContent='게임 실행 오류: '+e.message}}
document.getElementById('singleBtn').addEventListener('click',()=>launch(SINGLE_B64));
document.getElementById('multiBtn').addEventListener('click',()=>launch(MULTI_B64));
back.addEventListener('click',()=>{frame.srcdoc='';frame.style.display='none';back.style.display='none';launcher.style.display='flex'});
})();

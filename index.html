<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0e1118;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#launcher{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 25%,#29314a 0,#151923 38%,#0e1118 72%);z-index:10}
.panel{width:min(560px,96vw);background:#171b26;border:1px solid #ffffff1f;border-radius:24px;padding:22px;box-shadow:0 24px 80px #0008;text-align:center}
.logo{font-size:34px;font-weight:1000;letter-spacing:-1px;margin-bottom:4px}
.sub{font-size:12px;color:#aeb6c8;margin-bottom:18px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1px solid #ffffff24;background:#ffffff0c;color:#fff;border-radius:18px;padding:19px 12px;cursor:pointer;min-height:145px;font-weight:900}
.mode:hover{background:#ffffff16}
.mode:active{transform:scale(.98)}
.mode .ico{font-size:40px;display:block;margin-bottom:8px}
.mode strong{display:block;font-size:20px;margin-bottom:5px}
.mode small{display:block;color:#b9c0ce;font-size:10px;line-height:1.5}
.badges{margin-top:16px;font-size:9px;color:#98a1b4;line-height:1.7}
.badge{display:inline-block;padding:4px 8px;border:1px solid #ffffff18;background:#ffffff08;border-radius:999px;margin:2px}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0e1118;display:none}
#back{position:fixed;top:8px;right:8px;z-index:9999;display:none;background:#111d;color:#fff;border:1px solid #fff6;border-radius:10px;padding:7px 10px;font-weight:800;font-size:11px}
#error{display:none;margin-top:10px;color:#ff9d9d;font-size:11px}
@media(max-width:520px){
 .panel{padding:17px 12px}
 .logo{font-size:27px}
 .modes{grid-template-columns:1fr}
 .mode{min-height:110px;padding:13px}
 .mode .ico{font-size:31px}
}
</style>
</head>

  const launcher = document.getElementById('launcher');
  const frame = document.getElementById('frame');
  const back = document.getElementById('back');
  const error = document.getElementById('error');

  function decodeUtf8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  function launch(b64) {
    try {
      frame.srcdoc = decodeUtf8(b64);
      launcher.style.display = 'none';
      frame.style.display = 'block';
      back.style.display = 'block';
    } catch (e) {
      error.style.display = 'block';
      error.textContent = '게임 실행 오류: ' + e.message;
    }
  }

  document.getElementById('singleBtn').addEventListener('click', () => launch(SINGLE_B64));
  document.getElementById('multiBtn').addEventListener('click', () => launch(MULTI_B64));

  back.addEventListener('click', () => {
    frame.srcdoc = '';
    frame.style.display = 'none';
    back.style.display = 'none';
    launcher.style.display = 'flex';
  });
})();
</script>
